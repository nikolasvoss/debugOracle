# model = "gpt-5.6-terra"
# model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
apps.filesystem.default_tools_approval_mode = "approve"

web_search = "live"
[features]
multi_agent = true
use_linux_sandbox_bwrap = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.docs]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-fetch"]
# Broad web/file fetch is often redundant if OpenAI docs are the main need
enabled = false

