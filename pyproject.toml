[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "debugoracle"
version = "0.1.0"
description = "Passive embedded debug evidence packager for ChatGPT"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24,<2",
    "pymupdf4llm>=0.0.17",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
semantic = ["sentence-transformers>=2.7", "numpy>=1.26"]
dev = ["pyright", "pytest"]

[project.scripts]
dbgoracle = "debugoracle:main"

[tool.setuptools.packages.find]
include = ["debugoracle*"]
