name: quality-and-traceability

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: quality-and-traceability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    env:
      DEBUGORACLE_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      DEBUGORACLE_SKIP_PRIVATE_REFERENCE: ${{ github.ref_type == 'tag' && '0' || '1' }}
      PYTEST_ADDOPTS: "${{ github.ref_type == 'tag' && '' || '--ignore=tests/test_reference_workspace_samples.py --deselect=tests/test_public_release_contract.py::PublicReleaseContractTests::test_vendor_manual_and_generated_doc_artifacts_are_not_tracked' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ github.ref_type == 'tag' && 'recursive' || 'false' }}

      - name: Verify recursive submodule state
        if: github.ref_type == 'tag'
        run: |
          submodule_status="$(git submodule status --recursive)"
          printf '%s\n' "$submodule_status"
          if printf '%s\n' "$submodule_status" | grep -Eq '^[+-U]'; then
            echo "Recursive submodules are missing or do not match their pinned commits." >&2
            echo "Run: git submodule update --init --recursive" >&2
            exit 1
          fi

      - name: Report deferred private reference gate
        if: github.ref_type != 'tag'
        run: echo "Private reference-workspace checkout is deferred; tag validation remains strict."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create verification environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pre-commit bandit pytest-cov
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run quality gate
        run: PATH="$PWD/.venv/bin:$PATH" timeout 5m ./scripts/verify.sh full

  compatibility-gate:
    runs-on: ubuntu-24.04
    env:
      DEBUGORACLE_SKIP_PRIVATE_REFERENCE: ${{ github.ref_type == 'tag' && '0' || '1' }}
      PYTEST_ADDOPTS: "${{ github.ref_type == 'tag' && '' || '--ignore=tests/test_reference_workspace_samples.py --deselect=tests/test_public_release_contract.py::PublicReleaseContractTests::test_vendor_manual_and_generated_doc_artifacts_are_not_tracked' }}"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ github.ref_type == 'tag' && 'recursive' || 'false' }}

      - name: Verify recursive submodule state
        if: github.ref_type == 'tag'
        run: |
          submodule_status="$(git submodule status --recursive)"
          printf '%s\n' "$submodule_status"
          if printf '%s\n' "$submodule_status" | grep -Eq '^[+-U]'; then
            echo "Recursive submodules are missing or do not match their pinned commits." >&2
            echo "Run: git submodule update --init --recursive" >&2
            exit 1
          fi

      - name: Report deferred private reference gate
        if: github.ref_type != 'tag'
        run: echo "Private reference-workspace checkout is deferred; tag validation remains strict."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install compatibility-test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run non-HIL compatibility tests
        run: >-
          python -m pytest tests/ -x -q --tb=short
          --ignore=tests/debugoracle-hil-tests

  artifact-gate:
    runs-on: ubuntu-24.04
    env:
      DEBUGORACLE_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      DEBUGORACLE_SKIP_PRIVATE_REFERENCE: ${{ github.ref_type == 'tag' && '0' || '1' }}
      PYTEST_ADDOPTS: "${{ github.ref_type == 'tag' && '' || '--ignore=tests/test_reference_workspace_samples.py --deselect=tests/test_public_release_contract.py::PublicReleaseContractTests::test_vendor_manual_and_generated_doc_artifacts_are_not_tracked' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ github.ref_type == 'tag' && 'recursive' || 'false' }}

      - name: Verify recursive submodule state
        if: github.ref_type == 'tag'
        run: |
          submodule_status="$(git submodule status --recursive)"
          printf '%s\n' "$submodule_status"
          if printf '%s\n' "$submodule_status" | grep -Eq '^[+-U]'; then
            echo "Recursive submodules are missing or do not match their pinned commits." >&2
            echo "Run: git submodule update --init --recursive" >&2
            exit 1
          fi

      - name: Report deferred private reference gate
        if: github.ref_type != 'tag'
        run: echo "Private reference-workspace checkout is deferred; tag validation remains strict."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create release-verification environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pre-commit bandit pytest-cov build twine
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Build and smoke release artifacts
        run: PATH="$PWD/.venv/bin:$PATH" timeout 10m ./scripts/verify-release.sh

  traceability-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate traceability fields for behavior changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "push event: skipping PR-body traceability checks"
            exit 0
          fi

          BODY="${PR_BODY:-}"

          if ! printf "%s" "$BODY" | grep -Eq "Behavior Change:[[:space:]]*(yes|no)"; then
            echo "traceability-gate: missing 'Behavior Change: yes/no' field"
            exit 1
          fi

          if printf "%s" "$BODY" | grep -Eq "Behavior Change:[[:space:]]*yes"; then
            for required in "Spec:" "Plan:" "Acceptance Criteria -> Validation"; do
              if ! printf "%s" "$BODY" | grep -Fq "$required"; then
                echo "traceability-gate: missing required field for behavior change: $required"
                exit 1
              fi
            done

            # Require non-placeholder values for Spec and Plan.
            spec_line=$(printf "%s\n" "$BODY" | grep -E '^[[:space:]]*-[[:space:]]*Spec:' | head -n1 || true)
            plan_line=$(printf "%s\n" "$BODY" | grep -E '^[[:space:]]*-[[:space:]]*Plan:' | head -n1 || true)

            spec_value=$(printf "%s" "$spec_line" | sed -E 's/^[[:space:]]*-[[:space:]]*Spec:[[:space:]]*//')
            plan_value=$(printf "%s" "$plan_line" | sed -E 's/^[[:space:]]*-[[:space:]]*Plan:[[:space:]]*//')

            if [ -z "$spec_value" ] || printf "%s" "$spec_value" | grep -Eq '^<!--'; then
              echo "traceability-gate: Spec must have a non-placeholder link/path when Behavior Change: yes"
              exit 1
            fi

            if [ -z "$plan_value" ] || printf "%s" "$plan_value" | grep -Eq '^<!--'; then
              echo "traceability-gate: Plan must have a non-placeholder link/path when Behavior Change: yes"
              exit 1
            fi

            if ! printf "%s\n" "$BODY" | grep -Eq '^\|[[:space:]]*AC-[0-9]+'; then
              echo "traceability-gate: AC mapping table must include at least one AC row (example: | AC-001 | test | tests/... |)"
              exit 1
            fi
          fi

          exception_requested="false"
          if printf "%s" "$BODY" | grep -Ei '(^|[[:space:][:punct:]])exception requested:[[:space:]]*yes([[:space:][:punct:]]|$)' >/dev/null; then
            exception_requested="true"
          elif printf "%s" "$BODY" | grep -Ei '(^|[[:space:][:punct:]])exception:[[:space:]]*yes([[:space:][:punct:]]|$)' >/dev/null; then
            exception_requested="true"
          fi

          if [ "$exception_requested" = "true" ]; then
            for required_exception_field in "what is being skipped" "why it is safe" "follow-up work" "expiry"; do
              if ! printf "%s" "$BODY" | grep -Fiq "$required_exception_field"; then
                echo "traceability-gate: exception justification is incomplete, missing: $required_exception_field"
                exit 1
              fi
            done
          fi

          echo "traceability-gate: pass"
